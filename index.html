/* ========== Liquid Chrome 全站背景（React Bits 组件原生移植，WebGL） ========== */
(function initLiquidBackground() {
  const canvas = document.getElementById('liquidBg');
  if (!canvas) return;
  if (window.__skipLiquid){ canvas.style.display='none'; return; }
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false }) ||
             canvas.getContext('experimental-webgl', { antialias: true, alpha: false });
  if (!gl) return;

  const vertexSrc = `
    attribute vec2 position;
    attribute vec2 uv;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 0.0, 1.0);
    }
  `;

  const fragmentSrc = `
    precision highp float;
    uniform float uTime;
    uniform vec3 uResolution;
    uniform vec3 uBaseColor;
    uniform float uAmplitude;
    uniform float uFrequencyX;
    uniform float uFrequencyY;
    uniform vec2 uMouse;
    varying vec2 vUv;

    vec4 renderImage(vec2 uvCoord) {
        vec2 fragCoord = uvCoord * uResolution.xy;
        vec2 uv = (2.0 * fragCoord - uResolution.xy) / min(uResolution.x, uResolution.y);

        for (float i = 1.0; i < 10.0; i++){
            uv.x += uAmplitude / i * cos(i * uFrequencyX * uv.y + uTime + uMouse.x * 3.14159);
            uv.y += uAmplitude / i * cos(i * uFrequencyY * uv.x + uTime + uMouse.y * 3.14159);
        }

        vec2 diff = (uvCoord - uMouse);
        float dist = length(diff);
        float falloff = exp(-dist * 20.0);
        float ripple = sin(10.0 * dist - uTime * 2.0) * 0.03;
        uv += (diff / (dist + 0.0001)) * ripple * falloff;

        vec3 color = uBaseColor / abs(sin(uTime - uv.y - uv.x));
        return vec4(color, 1.0);
    }

    void main() {
        vec4 col = vec4(0.0);
        int samples = 0;
        for (int i = -1; i <= 1; i++){
            for (int j = -1; j <= 1; j++){
                vec2 offset = vec2(float(i), float(j)) * (1.0 / min(uResolution.x, uResolution.y));
                col += renderImage(vUv + offset);
                samples++;
            }
        }
        gl_FragColor = col / float(samples);
    }
  `;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('LiquidChrome shader error:', gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }
  const vs = compile(gl.VERTEX_SHADER, vertexSrc);
  const fs = compile(gl.FRAGMENT_SHADER, fragmentSrc);
  if (!vs || !fs) return;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('LiquidChrome program link error:', gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  // 全屏三角形（ogl Triangle）：position + uv
  const verts = new Float32Array([
    -1, -1, 0, 0,
     3, -1, 2, 0,
    -1,  3, 0, 2
  ]);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  const stride = 4 * 4;
  const aPos = gl.getAttribLocation(prog, 'position');
  const aUv = gl.getAttribLocation(prog, 'uv');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, stride, 0);
  gl.enableVertexAttribArray(aUv);
  gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, stride, 8);

  const uTime = gl.getUniformLocation(prog, 'uTime');
  const uRes = gl.getUniformLocation(prog, 'uResolution');
  const uColor = gl.getUniformLocation(prog, 'uBaseColor');
  const uAmp = gl.getUniformLocation(prog, 'uAmplitude');
  const uFx = gl.getUniformLocation(prog, 'uFrequencyX');
  const uFy = gl.getUniformLocation(prog, 'uFrequencyY');
  const uMouse = gl.getUniformLocation(prog, 'uMouse');

  const DPR = Math.min(window.devicePixelRatio || 1, (window.__skipLiquid ? 1 : 2));
  function resize() {
    const w = Math.floor(window.innerWidth * DPR);
    const h = Math.floor(window.innerHeight * DPR);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, w, h);
    gl.uniform3f(uRes, w, h, w / h);
  }

  // 主题颜色：浅色 = 亮蓝青，深色 = 深海蓝
  const THEME_COLORS = {
    light: [0.46, 0.60, 0.92],
    dark:  [0.10, 0.17, 0.36]
  };
  let curTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  function applyColor() {
    const c = THEME_COLORS[curTheme];
    gl.uniform3f(uColor, c[0], c[1], c[2]);
  }
  window.__setLiquidTheme = (t) => {
    if (!t || !THEME_COLORS[t]) return;
    curTheme = t;
    applyColor();
  };

  gl.uniform1f(uAmp, 0.5);
  gl.uniform1f(uFx, 2.5);
  gl.uniform1f(uFy, 1.5);
  applyColor();
  resize();

  window.addEventListener('resize', resize);

  // 光标/触摸交互（canvas 为 pointer-events:none，故监听 window）
  const mouse = [0.5, 0.5];
  function onMove(x, y) {
    mouse[0] = Math.max(0, Math.min(1, x / window.innerWidth));
    mouse[1] = Math.max(0, Math.min(1, 1 - y / window.innerHeight));
  }
  window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (e.touches.length) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  const t0 = performance.now();
  function frame() {
    requestAnimationFrame(frame);
    gl.uniform1f(uTime, (performance.now() - t0) * 0.001);
    gl.uniform2f(uMouse, mouse[0], mouse[1]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  frame();
})();

  /* ===== 移动端适配脚本 ===== */
  (function(){
    // 检测移动端：跳过重型 WebGL 液体背景以省电
    var isMobile = matchMedia('(max-width:768px)').matches
                || matchMedia('(pointer:coarse)').matches;
    if (isMobile) window.__skipLiquid = true;
    var canvas = document.getElementById('liquidBg');
    if (canvas && window.__skipLiquid) canvas.style.display = 'none';

    // 汉堡菜单
    var t = document.getElementById('navToggle');
    var l = document.getElementById('navLinks');
    if (t && l){
      function set(open){
        l.classList.toggle('open', open);
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
        t.textContent = open ? '✕' : '☰';
      }
      t.addEventListener('click', function(e){
        e.stopPropagation();
        set(!l.classList.contains('open'));
      });
      l.querySelectorAll('a').forEach(function(a){
        a.addEventListener('click', function(){ set(false); });
      });
      document.addEventListener('click', function(e){
        if (!l.contains(e.target) && !t.contains(e.target)) set(false);
      });
      // 切换横竖屏时重算
      matchMedia('(max-width:768px)').addEventListener('change', function(){
        if (!matchMedia('(max-width:768px)').matches) set(false);
      });
    }
  })();

</script>
